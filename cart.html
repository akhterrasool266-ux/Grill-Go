<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cart — Grill & Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E5D34">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="brand-row"><span class="brand-mark" id="brandMark">Grill & Go</span></div>
  </div>

  <div class="section">
    <div class="section-head"><div class="section-title">Your Cart</div></div>
    <div id="cartList"></div>
    <div id="deliveryFormWrap"></div>
    <div id="cartSummaryWrap"></div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span>Home</a>
    <a href="menu.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,3 21,8 12,13 3,8"/><polyline points="3,12 12,17 21,12"/><polyline points="3,16 12,21 21,16"/></svg></span>Menu</a>
    <a href="cart.html" class="nav-item active">
      <div class="cart-fab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="cart-badge" id="cartBadge" style="display:none;">0</span></div>
    </a>
    <a href="offers.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 11 3.8A2 2 0 0 0 9.6 3H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .8 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.4-4.4a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg></span>Offers</a>
    <a href="login.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></span>Log In</a>
  </div>

<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
<!-- Phase 3: overlays live Firestore settings (e.g. WhatsApp number) onto config, and lets checkout() save the order -->
<script type="module" src="js/firebase-init.js?v=3"></script>
<script type="module">
  await window.rgReady;

  const cur = RESTAURANT_CONFIG.currencySymbol;
  const DELIVERY_INFO_KEY = `ezy_delivery_${RESTAURANT_CONFIG.restaurantId}`;

  function getDeliveryInfo() {
    try {
      return JSON.parse(localStorage.getItem(DELIVERY_INFO_KEY)) || {};
    } catch { return {}; }
  }
  function saveDeliveryInfo(info) {
    localStorage.setItem(DELIVERY_INFO_KEY, JSON.stringify(info));
  }

  function renderDeliveryForm() {
    const info = getDeliveryInfo();
    document.getElementById('deliveryFormWrap').innerHTML = `
      <div class="delivery-form">
        <div class="form-title">Delivery details</div>
        <label class="form-label">Full name</label>
        <input class="form-input" id="custName" placeholder="Your name" value="${info.name ? info.name.replace(/"/g, '&quot;') : ''}">
        <label class="form-label">City</label>
        <input class="form-input" id="custCity" placeholder="e.g. Karachi" value="${info.city ? info.city.replace(/"/g, '&quot;') : ''}">
        <label class="form-label">Complete address</label>
        <input class="form-input" id="custAddress" placeholder="House #, street, area, landmark" value="${info.address ? info.address.replace(/"/g, '&quot;') : ''}">
      </div>
    `;
  }

  function render() {
    const cart = getCart();
    const listEl = document.getElementById('cartList');
    const wrap = document.getElementById('cartSummaryWrap');
    const formWrap = document.getElementById('deliveryFormWrap');

    if (cart.length === 0) {
      listEl.innerHTML = '';
      formWrap.innerHTML = '';
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="empty-emoji">🛍️</div>
          <div>Your cart is empty</div>
        </div>`;
      return;
    }

    renderDeliveryForm();

    listEl.innerHTML = cart.map((c, i) => `
      <div class="cart-item">
        <div class="cart-item-img">${c.image ? `<img src="${c.image}">` : itemImagePlaceholder(c)}</div>
        <div class="cart-item-body">
          <div class="cart-item-name">${c.qty} × ${c.name}</div>
          <div class="cart-item-meta">
            ${c.sizeName ? c.sizeName : ''}${c.addonNames.length ? ' • ' + c.addonNames.join(', ') : ''}
          </div>
          <div class="item-price">${cur}${c.lineTotal}</div>
        </div>
        <button class="qty-btn" onclick="removeItem(${i})">✕</button>
      </div>
    `).join('');

    const total = cart.reduce((s, c) => s + c.lineTotal, 0);
    wrap.innerHTML = `
      <div class="cart-summary">
        <div class="summary-row"><span>Subtotal</span><span>${cur}${total}</span></div>
        <div class="summary-row"><span>Delivery</span><span>Calculated at checkout</span></div>
        <div class="summary-row total"><span>Total</span><span>${cur}${total}</span></div>
      </div>
      <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Proceed to Checkout</button>
    `;
  }

  // This script is now type="module" (needed for top-level `await` above),
  // so top-level functions are module-scoped, not automatically on window.
  // The rendered markup calls removeItem(...) / checkout() via inline onclick,
  // so both must be attached to window explicitly.
  window.removeItem = function removeItem(i) {
    removeFromCart(i);
    render();
  };

  window.checkout = async function checkout() {
    const cart = getCart();
    if (!cart.length) return;

    const name = document.getElementById('custName').value.trim();
    const city = document.getElementById('custCity').value.trim();
    const address = document.getElementById('custAddress').value.trim();
    if (!name || !city || !address) {
      toast('Please fill in your name, city and address');
      return;
    }
    saveDeliveryInfo({ name, city, address });

    const btn = document.getElementById('checkoutBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Placing order...'; }

    const lines = cart.map(c => `${c.qty}x ${c.name}${c.sizeName ? ' (' + c.sizeName + ')' : ''}`);
    const total = cart.reduce((s, c) => s + c.lineTotal, 0);

    // Phase 3: save the order to Firestore so it shows up in the admin panel.
    // Best-effort — if this fails (offline, Firebase not set up yet), checkout
    // still proceeds over WhatsApp exactly like Phase 1/2 did.
    await window.rgWriteOrder({
      items: cart,
      total,
      currency: cur,
      restaurantName: RESTAURANT_CONFIG.name,
      customer: { name, city, address }
    });

    const msg = encodeURIComponent(`New order from ${RESTAURANT_CONFIG.name}:\n${lines.join('\n')}\n\nTotal: ${cur}${total}\n\nDeliver to:\n${name}\n${address}, ${city}`);
    window.open(`https://wa.me/${RESTAURANT_CONFIG.whatsapp}?text=${msg}`, '_blank');

    if (btn) { btn.disabled = false; btn.textContent = 'Proceed to Checkout'; }
  };

  render();
</script>
</body>
</html>

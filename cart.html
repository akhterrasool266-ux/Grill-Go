<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cart — Grill & Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1B1B">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="brand-row"><span class="brand-mark" id="brandMark">Grill & Go</span></div>
  </div>

  <div class="section">
    <div class="section-head"><div class="section-title">Your Cart</div></div>
    <div id="cartList"></div>
    <div id="cartSummaryWrap"></div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="menu.html" class="nav-item"><span class="nav-icon">📋</span>Menu</a>
    <a href="cart.html" class="nav-item active">
      <div class="cart-fab">🛍️<span class="cart-badge" id="cartBadge" style="display:none;">0</span></div>
    </a>
    <a href="offers.html" class="nav-item"><span class="nav-icon">🏷️</span>Offers</a>
    <a href="login.html" class="nav-item"><span class="nav-icon">👤</span>Log In</a>
  </div>

<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
<script>
  const cur = RESTAURANT_CONFIG.currencySymbol;

  function render() {
    const cart = getCart();
    const listEl = document.getElementById('cartList');
    const wrap = document.getElementById('cartSummaryWrap');

    if (cart.length === 0) {
      listEl.innerHTML = '';
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="empty-emoji">🛍️</div>
          <div>Your cart is empty</div>
        </div>`;
      return;
    }

    listEl.innerHTML = cart.map((c, i) => `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${c.qty} × ${c.name}</div>
          <div class="cart-item-meta">
            ${c.sizeName ? c.sizeName : ''}${c.addonNames.length ? ' • ' + c.addonNames.join(', ') : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="item-price">${cur}${c.lineTotal}</div>
          <button class="qty-btn" onclick="removeItem(${i})">✕</button>
        </div>
      </div>
    `).join('');

    const total = cart.reduce((s, c) => s + c.lineTotal, 0);
    wrap.innerHTML = `
      <div class="cart-summary">
        <div class="summary-row"><span>Subtotal</span><span>${cur}${total}</span></div>
        <div class="summary-row"><span>Delivery</span><span>Calculated at checkout</span></div>
        <div class="summary-row total"><span>Total</span><span>${cur}${total}</span></div>
      </div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    `;
  }

  function removeItem(i) {
    removeFromCart(i);
    render();
  }

  function checkout() {
    // Phase 1: WhatsApp handoff. Phase 3 replaces this with Firestore order write.
    const cart = getCart();
    const lines = cart.map(c => `${c.qty}x ${c.name}${c.sizeName ? ' (' + c.sizeName + ')' : ''}`);
    const total = cart.reduce((s, c) => s + c.lineTotal, 0);
    const msg = encodeURIComponent(`New order from ${RESTAURANT_CONFIG.name}:\n${lines.join('\n')}\n\nTotal: ${cur}${total}`);
    window.open(`https://wa.me/${RESTAURANT_CONFIG.whatsapp}?text=${msg}`, '_blank');
  }

  render();
</script>
</body>
</html>

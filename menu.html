<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Menu — Grill & Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1B1B">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="brand-row"><span class="brand-mark" id="brandMark">Grill & Go</span></div>
    <div class="search-bar">🔍 <span>Search burgers, pizza, drinks...</span></div>
  </div>

  <div class="section">
    <div class="cat-scroll" id="catScroll"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title" id="listTitle">Full Menu</div>
    </div>
    <div class="item-list" id="itemList"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal-sheet" id="modalBody"></div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="menu.html" class="nav-item active"><span class="nav-icon">📋</span>Menu</a>
    <a href="cart.html" class="nav-item">
      <div class="cart-fab">🛍️<span class="cart-badge" id="cartBadge" style="display:none;">0</span></div>
    </a>
    <a href="offers.html" class="nav-item"><span class="nav-icon">🏷️</span>Offers</a>
    <a href="login.html" class="nav-item"><span class="nav-icon">👤</span>Log In</a>
  </div>

<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('brandMark').textContent = RESTAURANT_CONFIG.name;
  const cur = RESTAURANT_CONFIG.currencySymbol;

  const params = new URLSearchParams(window.location.search);
  let activeCat = params.get('cat') || 'all';

  function renderCats() {
    const chips = [{ id: 'all', name: 'All', icon: '🔥' }, ...MENU_CATEGORIES];
    document.getElementById('catScroll').innerHTML = chips.map(c => `
      <div class="cat-chip ${activeCat === c.id ? 'active' : ''}" onclick="setCat('${c.id}')">
        <div class="cat-emoji">${c.icon}</div>
        <div class="cat-name">${c.name}</div>
      </div>
    `).join('');
  }

  function setCat(id) {
    activeCat = id;
    renderCats();
    renderItems();
  }

  function renderItems() {
    const items = activeCat === 'all'
      ? MENU_ITEMS
      : MENU_ITEMS.filter(i => i.categoryId === activeCat);

    const catName = activeCat === 'all' ? 'Full Menu' : MENU_CATEGORIES.find(c => c.id === activeCat)?.name;
    document.getElementById('listTitle').textContent = catName;

    document.getElementById('itemList').innerHTML = items.map(item => `
      <div class="item-card" onclick="openItemModal('${item.id}')">
        <div class="item-img">${item.image ? `<img src="${item.image}">` : ''}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.description}</div>
          <div class="item-bottom">
            <div class="item-price">${cur}${item.price}</div>
            <button class="add-btn" onclick="event.stopPropagation(); openItemModal('${item.id}')">Add</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  renderCats();
  renderItems();
</script>
</body>
</html>

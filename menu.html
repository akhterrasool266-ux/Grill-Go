<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Menu — Grill & Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E5D34">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="brand-row"><span class="brand-mark" id="brandMark">Grill & Go</span></div>
    <div class="search-bar">🔍 <span>Search burgers, pizza, drinks...</span></div>
  </div>

  <div class="section">
    <div class="cat-scroll" id="catScroll"></div>
  </div>

  <div class="section">
    <div class="section-head" style="justify-content:center;">
      <div class="section-title" id="listTitle" style="color:var(--primary);text-align:center;width:100%;">Full Menu</div>
    </div>
    <div class="item-list" id="itemList"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal-sheet" id="modalBody"></div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span>Home</a>
    <a href="menu.html" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,3 21,8 12,13 3,8"/><polyline points="3,12 12,17 21,12"/><polyline points="3,16 12,21 21,16"/></svg></span>Menu</a>
    <a href="cart.html" class="nav-item">
      <div class="cart-fab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="cart-badge" id="cartBadge" style="display:none;">0</span></div>
    </a>
    <a href="offers.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 11 3.8A2 2 0 0 0 9.6 3H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .8 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.4-4.4a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg></span>Offers</a>
    <a href="login.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></span>Log In</a>
  </div>

<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
<!-- Phase 3: overlays live Firestore menu/settings onto the globals above, if configured -->
<script type="module" src="js/firebase-init.js?v=3"></script>
<script type="module">
  document.getElementById('brandMark').textContent = RESTAURANT_CONFIG.name;
  const cur = RESTAURANT_CONFIG.currencySymbol;

  const params = new URLSearchParams(window.location.search);
  let activeCat = params.get('cat') || 'all';

  // A category name can appear on more than one category doc (e.g. demo data
  // imported twice from the admin panel). Group by name so every item that
  // belongs to any of those duplicate docs still shows up together under one
  // chip, instead of being split across near-identical categories.
  function catNameById(id) {
    return MENU_CATEGORIES.find(c => c.id === id)?.name;
  }

  function uniqueCats() {
    const seen = new Set();
    return MENU_CATEGORIES.filter(c => {
      if (seen.has(c.name)) return false;
      seen.add(c.name);
      return true;
    });
  }

  function renderCats() {
    const activeName = activeCat === 'all' ? 'all' : catNameById(activeCat);
    const chips = [{ id: 'all', name: 'All', icon: '🔥' }, ...uniqueCats()];
    document.getElementById('catScroll').innerHTML = chips.map(c => `
      <div class="cat-chip ${(c.id === 'all' ? activeName === 'all' : c.name === activeName) ? 'active' : ''}" onclick="setCat('${c.id}')">
        <div class="cat-emoji">${c.icon}</div>
        <div class="cat-name">${c.name}</div>
      </div>
    `).join('');
  }

  // This script is now type="module" (needed for top-level `await` above),
  // so top-level functions are module-scoped, not automatically on window.
  // The rendered markup calls setCat(...) via inline onclick, so it must be
  // attached to window explicitly.
  window.setCat = function setCat(id) {
    activeCat = id;
    renderCats();
    renderItems();
  };

  function renderItems() {
    const activeName = activeCat === 'all' ? 'all' : catNameById(activeCat);
    const items = activeCat === 'all'
      ? MENU_ITEMS
      : MENU_ITEMS.filter(i => catNameById(i.categoryId) === activeName);

    const catName = activeCat === 'all' ? 'Full Menu' : activeName;
    document.getElementById('listTitle').textContent = catName;

    document.getElementById('itemList').innerHTML = items.map(item => `
      <div class="item-card" onclick="openItemModal('${item.id}')">
        <div class="item-img">${item.image ? `<img src="${item.image}">` : itemImagePlaceholder(item)}</div>
        <div class="item-info">
          <div class="item-info-name-row">
            <div class="item-name">${item.name}</div>
            <span class="info-dot">i</span>
          </div>
          <div class="item-desc">${item.description}</div>
          <div class="item-bottom">
            <div class="item-price">${cur}${item.price}</div>
            <button class="add-btn" onclick="event.stopPropagation(); openItemModal('${item.id}')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Add</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderPage() {
    renderCats();
    renderItems();
  }

  // Re-render if the live Firestore menu finishes loading after our initial
  // paint (e.g. rgReady hit its timeout on a slow connection) — otherwise
  // the page would be stuck showing the static demo data indefinitely.
  window.onMenuLoaded = renderPage;

  await window.rgReady;
  renderPage();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Menu — Grill & Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1B1B">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="brand-row"><span class="brand-mark" id="brandMark">Grill & Go</span></div>
    <div class="search-bar">🔍 <span>Search burgers, pizza, drinks...</span></div>
  </div>

  <div class="section">
    <div class="cat-scroll" id="catScroll"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title" id="listTitle">Full Menu</div>
    </div>
    <div class="item-list" id="itemList"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal-sheet" id="modalBody"></div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="menu.html" class="nav-item active"><span class="nav-icon">📋</span>Menu</a>
    <a href="cart.html" class="nav-item">
      <div class="cart-fab">🛍️<span class="cart-badge" id="cartBadge" style="display:none;">0</span></div>
    </a>
    <a href="offers.html" class="nav-item"><span class="nav-icon">🏷️</span>Offers</a>
    <a href="login.html" class="nav-item"><span class="nav-icon">👤</span>Log In</a>
  </div>

<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
<!-- Phase 3: overlays live Firestore menu/settings onto the globals above, if configured -->
<script type="module" src="js/firebase-init.js?v=3"></script>
<script type="module">
  await window.rgReady;

  document.getElementById('brandMark').textContent = RESTAURANT_CONFIG.name;
  const cur = RESTAURANT_CONFIG.currencySymbol;

  const params = new URLSearchParams(window.location.search);
  let activeCat = params.get('cat') || 'all';

  // A category name can appear on more than one category doc (e.g. demo data
  // imported twice from the admin panel). Group by name so every item that
  // belongs to any of those duplicate docs still shows up together under one
  // chip, instead of being split across near-identical categories.
  function catNameById(id) {
    return MENU_CATEGORIES.find(c => c.id === id)?.name;
  }

  function uniqueCats() {
    const seen = new Set();
    return MENU_CATEGORIES.filter(c => {
      if (seen.has(c.name)) return false;
      seen.add(c.name);
      return true;
    });
  }

  function renderCats() {
    const activeName = activeCat === 'all' ? 'all' : catNameById(activeCat);
    const chips = [{ id: 'all', name: 'All', icon: '🔥' }, ...uniqueCats()];
    document.getElementById('catScroll').innerHTML = chips.map(c => `
      <div class="cat-chip ${(c.id === 'all' ? activeName === 'all' : c.name === activeName) ? 'active' : ''}" onclick="setCat('${c.id}')">
        <div class="cat-emoji">${c.icon}</div>
        <div class="cat-name">${c.name}</div>
      </div>
    `).join('');
  }

  // This script is now type="module" (needed for top-level `await` above),
  // so top-level functions are module-scoped, not automatically on window.
  // The rendered markup calls setCat(...) via inline onclick, so it must be
  // attached to window explicitly.
  window.setCat = function setCat(id) {
    activeCat = id;
    renderCats();
    renderItems();
  };

  function renderItems() {
    const activeName = activeCat === 'all' ? 'all' : catNameById(activeCat);
    const items = activeCat === 'all'
      ? MENU_ITEMS
      : MENU_ITEMS.filter(i => catNameById(i.categoryId) === activeName);

    const catName = activeCat === 'all' ? 'Full Menu' : activeName;
    document.getElementById('listTitle').textContent = catName;

    document.getElementById('itemList').innerHTML = items.map(item => `
      <div class="item-card" onclick="openItemModal('${item.id}')">
        <div class="item-img">${item.image ? `<img src="${item.image}">` : ''}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.description}</div>
          <div class="item-bottom">
            <div class="item-price">${cur}${item.price}</div>
            <button class="add-btn" onclick="event.stopPropagation(); openItemModal('${item.id}')">Add</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  renderCats();
  renderItems();
</script>
</body>
</html>

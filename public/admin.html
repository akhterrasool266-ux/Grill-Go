<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Store admin</title>
<link rel="icon" href="/icons/favicon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--brand:#15756b;--brand-dk:#0f5c54;--accent:#e6f2f0;--ink:#14201e;--muted:#6b7280;
--line:#e2e8e7;--bg:#f5f8f7;--card:#fff;--danger:#b42318;--ok:#0a8754;--warn:#b25e00;--r:12px}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:var(--bg);color:var(--ink);overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand)}
h1,h2,h3{margin:0 0 .5em;line-height:1.2}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}
.hide{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px}

/* login */
#login{min-height:100dvh;display:grid;place-items:center;padding:20px}
#login .box{width:100%;max-width:370px;background:var(--card);border:1px solid var(--line);
border-radius:16px;padding:26px;box-shadow:0 10px 40px rgba(16,40,36,.07)}
#login h1{text-align:center;margin-bottom:6px}
#login p{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 18px}

/* shell */
header.top{position:sticky;top:0;z-index:40;background:var(--card);
border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:10px;height:54px;max-width:1240px;margin:0 auto;padding:0 14px}
.topin b{font-size:16px}
.chip{margin-left:auto;font-size:12px;color:var(--muted);max-width:42vw;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--card);
border-bottom:1px solid var(--line);padding:0 8px;scrollbar-width:none;position:sticky;top:54px;z-index:39}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--muted);
border-bottom:2.5px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{padding:16px 0 70px}

/* pieces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.stat small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.stat b{font-size:21px}
label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 4px}
.inp,select,textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;
padding:9px 12px;background:#fff;outline:none;font-size:15px}
.inp:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;
padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.d{background:#fff;border-color:#f3c9c6;color:var(--danger)}
.btn.w{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
background:var(--accent);color:var(--brand-dk)}
.pill.ok{background:#e7f7ef;color:#0a6b45}.pill.bad{background:#fdeceb;color:var(--danger)}
.pill.warn{background:#fff7e6;color:var(--warn)}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item img{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--bg);flex:0 0 auto}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--muted);font-size:12px}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.ok{color:var(--ok);font-size:13px;margin-top:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative;width:70px;height:70px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center}
.vrow{display:grid;grid-template-columns:1.4fr .9fr .9fr .6fr auto;gap:6px;align-items:center;margin-bottom:6px}
.vrow .inp{min-height:38px;padding:6px 9px;font-size:13.5px}
dialog{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 24px);
box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(12,22,20,.5)}
dialog .dh{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line);
position:sticky;top:0;background:#fff;z-index:2}
dialog .db{padding:14px;max-height:72dvh;overflow:auto}
dialog .df{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;
position:sticky;bottom:0;background:#fff}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:#14201e;color:#fff;
padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
transition:.2s;z-index:100;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}
.bars i{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
@media(min-width:700px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .two.t3{grid-template-columns:1fr 1fr 1fr}
  main{padding-bottom:30px}
}
@media(min-width:1000px){
  .split{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
}
</style>
</head>
<body>

<!-- ------------------------------- LOGIN ------------------------------- -->
<section id="login">
  <form class="box" id="loginForm">
    <h1>Store admin</h1>
    <p>Sign in to manage your store</p>
    <label for="em">Email</label>
    <input class="inp" id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input class="inp" id="pw" type="password" autocomplete="current-password" required>
    <button class="btn p w" style="margin-top:14px" id="loginBtn">Sign in</button>
    <div class="err hide" id="loginErr"></div>
    <p style="margin:14px 0 0;font-size:12px">Accounts are created in Supabase → Authentication.</p>
  </form>
</section>

<!-- ------------------------------- SHELL ------------------------------- -->
<div id="app" class="hide">
  <header class="top"><div class="topin">
    <b>Store admin</b>
    <span class="chip" id="who"></span>
    <button class="btn" id="logout" style="min-height:34px;padding:0 12px">Sign out</button>
  </div></header>
  <nav class="tabs" id="tabs"></nav>
  <main class="wrap" id="view"></main>
</div>

<div id="toast"></div>

<!-- ------------------------------ PRODUCT ------------------------------ -->
<dialog id="pdlg"><form method="dialog" id="pform">
  <div class="dh"><b id="ptitle">Product</b>
    <button class="btn" value="cancel" style="margin-left:auto;min-height:34px;padding:0 12px">Close</button></div>
  <div class="db">
    <label>Product name *</label><input class="inp" name="name" required>
    <label>URL slug * <span class="muted">(this becomes /product/<span id="slugPrev">…</span>)</span></label>
    <input class="inp" name="slug" required pattern="[a-z0-9\-]+">
    <div class="two">
      <div><label>Price (Rs) *</label><input class="inp" name="price" type="number" min="0" step="1" required></div>
      <div><label>Original price</label><input class="inp" name="original_price" type="number" min="0" step="1"></div>
    </div>
    <div class="two">
      <div><label>Stock</label><input class="inp" name="stock" type="number" min="0" step="1" value="0"></div>
      <div><label>SKU</label><input class="inp" name="sku"></div>
    </div>
    <div class="two">
      <div><label>Brand</label><input class="inp" name="brand"></div>
      <div><label>Category</label><select name="category_id" id="pcat"></select></div>
    </div>
    <label>Short description <span class="muted">(shown under the title, also used as the meta description)</span></label>
    <textarea class="inp" name="short_description" maxlength="300" style="min-height:60px"></textarea>
    <label>Full description</label>
    <textarea class="inp" name="description"></textarea>
    <label>Key features <span class="muted">(one per line — shown with tick marks)</span></label>
    <textarea class="inp" name="features" style="min-height:70px"></textarea>
    <label>Questions &amp; answers <span class="muted">(Question | Answer — one per line, becomes Google FAQ data)</span></label>
    <textarea class="inp" name="benefits" style="min-height:70px"></textarea>

    <h3 style="margin-top:18px">Images</h3>
    <input type="file" id="pimgs" accept="image/*" multiple class="inp" style="padding:8px">
    <div class="muted" id="upStatus"></div>
    <div class="thumbs" id="pthumbs"></div>

    <h3 style="margin-top:18px">Packs / variants <span class="muted" style="font-weight:400">(optional)</span></h3>
    <div id="pvars"></div>
    <button type="button" class="btn" id="addVar" style="margin-top:6px">+ Add pack</button>

    <h3 style="margin-top:18px">Search engine (SEO)</h3>
    <label>SEO title <span class="muted">(leave empty to use the product name)</span></label>
    <input class="inp" name="seo_title" maxlength="70">
    <label>SEO description</label>
    <textarea class="inp" name="seo_description" maxlength="170" style="min-height:56px"></textarea>

    <h3 style="margin-top:18px">Options</h3>
    <div class="two t3">
      <label style="font-weight:600"><input type="checkbox" name="is_active" checked> Active</label>
      <label style="font-weight:600"><input type="checkbox" name="is_featured"> Bestseller</label>
      <label style="font-weight:600"><input type="checkbox" name="is_trending"> Trending</label>
      <label style="font-weight:600"><input type="checkbox" name="track_stock" checked> Track stock</label>
      <label style="font-weight:600"><input type="checkbox" name="cod_enabled" checked> Allow COD</label>
      <label style="font-weight:600"><input type="checkbox" name="free_shipping"> Free shipping</label>
    </div>
    <div class="err hide" id="perr"></div>
  </div>
  <div class="df">
    <button class="btn p grow" id="psave" value="save">Save product</button>
    <button class="btn d" id="pdel" type="button">Delete</button>
  </div>
</form></dialog>

<!-- ------------------------------- ORDER ------------------------------- -->
<dialog id="odlg"><div>
  <div class="dh"><b id="otitle">Order</b>
    <button class="btn" id="oclose" style="margin-left:auto;min-height:34px;padding:0 12px">Close</button></div>
  <div class="db" id="obody"></div>
  <div class="df">
    <select id="ostatus" class="grow"></select>
    <button class="btn p" id="osave">Update</button>
  </div>
</div></dialog>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ===================== CONNECTION =====================
   These two values are safe in the browser: the anon key can only do what
   your Row Level Security policies allow. The service-role key is NEVER here —
   it lives only in Cloudflare as a Worker secret.
   ===================================================== */
const SUPABASE_URL = 'https://nezatsxwiavpgiatnuzt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lemF0c3h3aWF2cGdpYXRudXp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2Njc4MDYsImV4cCI6MjEwNjI0MzgwNn0.exN2MCEWK2PAVrYbiuTgkH9_7M2wmqHcXoTs7G9COzg';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const money = (n) => 'Rs ' + Math.round(Number(n) || 0).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slugify = (s) => String(s || '').toLowerCase().trim().replace(/&/g, ' and ')
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);

let TOAST;
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(TOAST); TOAST = setTimeout(() => t.classList.remove('on'), 2300);
}

const state = { settings: {}, categories: [], statuses: [], me: null };

/* ===================== AUTH ===================== */
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  btn.disabled = true; btn.textContent = 'Signing in…'; err.classList.add('hide');
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) { err.textContent = error.message; err.classList.remove('hide'); return; }
  boot();
});
$('#logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').classList.remove('hide'); $('#app').classList.add('hide'); return; }

  // must also be listed in admin_users, or every write will be refused by RLS
  const { data: adm } = await sb.from('admin_users').select('id,email,role').eq('id', session.user.id).maybeSingle();
  if (!adm) {
    $('#loginErr').textContent = 'This account is not an admin yet. Run the last step of schema.sql for this email.';
    $('#loginErr').classList.remove('hide');
    await sb.auth.signOut();
    return;
  }
  state.me = session.user;
  $('#who').textContent = session.user.email;
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');

  const [{ data: cats }, { data: st }, { data: sts }] = await Promise.all([
    sb.from('categories').select('*').order('sort_order'),
    sb.from('store_settings').select('data').eq('id', 1).maybeSingle(),
    sb.from('order_status').select('*').order('sort_order'),
  ]);
  state.categories = cats || [];
  state.settings = (st && st.data) || {};
  state.statuses = sts || [];
  renderTabs();
  go(location.hash.slice(1) || 'dashboard');
}

/* ===================== NAV ===================== */
const TABS = [
  ['dashboard', 'Dashboard'], ['orders', 'Orders'], ['products', 'Products'],
  ['categories', 'Categories'], ['coupons', 'Coupons'], ['customers', 'Customers'],
  ['settings', 'Settings'],
];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-t="${k}">${l}</button>`).join('');
  $$('#tabs button').forEach((b) => b.addEventListener('click', () => go(b.dataset.t)));
}
function go(tab) {
  if (!TABS.some(([k]) => k === tab)) tab = 'dashboard';
  history.replaceState(null, '', '#' + tab);
  $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  $('#view').innerHTML = '<p class="muted">Loading…</p>';
  ({ dashboard, orders, products, categories, coupons, customers, settings })[tab]();
  window.scrollTo(0, 0);
}
// phone back button moves between tabs instead of leaving the panel
window.addEventListener('hashchange', () => {
  const t = location.hash.slice(1);
  if (t && $('#app') && !$('#app').classList.contains('hide')) go(t);
});

/* ===================== DASHBOARD ===================== */
async function dashboard() {
  const days = Number(localStorage.getItem('adm_days') || 30);
  const since = new Date(Date.now() - days * 864e5).toISOString();
  const [{ data: ords }, { count: prodCount }, { count: custCount }] = await Promise.all([
    sb.from('orders').select('id,total,status,payment_state,created_at').gte('created_at', since).order('created_at'),
    sb.from('products').select('id', { count: 'exact', head: true }),
    sb.from('customers').select('id', { count: 'exact', head: true }),
  ]);
  const list = ords || [];
  const live = list.filter((o) => o.status !== 'cancelled');
  const revenue = live.reduce((s, o) => s + Number(o.total), 0);
  const pending = list.filter((o) => o.status === 'pending').length;

  const buckets = Array.from({ length: Math.min(days, 30) }, () => 0);
  const span = Math.min(days, 30);
  live.forEach((o) => {
    const d = Math.floor((Date.now() - new Date(o.created_at)) / 864e5);
    const i = span - 1 - d;
    if (i >= 0 && i < span) buckets[i] += Number(o.total);
  });
  const max = Math.max(1, ...buckets);

  $('#view').innerHTML = `
  <div class="row" style="margin-bottom:12px">
    <h1 style="margin:0" class="grow">Dashboard</h1>
    <select id="days" style="width:auto">
      ${[7, 30, 90, 365].map((d) => `<option value="${d}" ${d === days ? 'selected' : ''}>Last ${d} days</option>`).join('')}
    </select>
  </div>
  <div class="stats">
    <div class="stat"><small>Revenue</small><b>${money(revenue)}</b></div>
    <div class="stat"><small>Orders</small><b>${live.length}</b></div>
    <div class="stat"><small>Pending</small><b>${pending}</b></div>
    <div class="stat"><small>Products</small><b>${prodCount || 0}</b></div>
  </div>
  <div class="card">
    <h3>Revenue — last ${span} days</h3>
    <div class="bars">${buckets.map((v) => `<i style="height:${Math.round(v / max * 100)}%" title="${money(v)}"></i>`).join('')}</div>
    <div class="legend"><span>${span} days ago</span><span>Today</span></div>
  </div>
  <div class="card">
    <h3>Latest orders</h3>
    <div id="recent"><p class="muted">Loading…</p></div>
  </div>
  <div class="card"><h3>Customers</h3><p class="muted">${custCount || 0} customers have ordered from you.</p></div>`;

  $('#days').addEventListener('change', (e) => { localStorage.setItem('adm_days', e.target.value); dashboard(); });
  const { data: recent } = await sb.from('orders')
    .select('id,order_number,customer_name,total,status,created_at')
    .order('created_at', { ascending: false }).limit(6);
  $('#recent').innerHTML = (recent || []).map(orderRow).join('') || '<p class="muted">No orders yet.</p>';
  bindOrderRows();
}

/* ===================== ORDERS ===================== */
const statusPill = (s) => `<span class="pill ${s === 'delivered' ? 'ok' : s === 'cancelled' || s === 'returned' ? 'bad' : 'warn'}">${esc(s)}</span>`;
const orderRow = (o) => `<div class="item" data-order="${o.id}">
  <div class="t"><b>${esc(o.order_number)} · ${esc(o.customer_name)}</b>
    <small>${new Date(o.created_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} · ${money(o.total)}</small></div>
  ${statusPill(o.status)}</div>`;

function bindOrderRows() {
  $$('[data-order]').forEach((el) => el.addEventListener('click', () => openOrder(el.dataset.order)));
}

async function orders() {
  const f = localStorage.getItem('adm_ofilter') || '';
  $('#view').innerHTML = `
  <div class="row" style="margin-bottom:12px">
    <h1 style="margin:0" class="grow">Orders</h1>
    <select id="ofilter" style="width:auto">
      <option value="">All statuses</option>
      ${state.statuses.map((s) => `<option value="${s.code}" ${f === s.code ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}
    </select>
  </div>
  <input class="inp" id="osearch" placeholder="Search order number or phone…" style="margin-bottom:12px">
  <div class="card" id="olist"><p class="muted">Loading…</p></div>`;

  const load = async () => {
    let q = sb.from('orders').select('id,order_number,customer_name,phone,total,status,created_at')
      .order('created_at', { ascending: false }).limit(100);
    const st = $('#ofilter').value;
    if (st) q = q.eq('status', st);
    const term = $('#osearch').value.trim();
    if (term) q = q.or(`order_number.ilike.*${term}*,phone.ilike.*${term}*`);
    const { data, error } = await q;
    $('#olist').innerHTML = error ? `<p class="err">${esc(error.message)}</p>`
      : (data || []).map(orderRow).join('') || '<p class="muted">No orders found.</p>';
    bindOrderRows();
  };
  $('#ofilter').addEventListener('change', (e) => { localStorage.setItem('adm_ofilter', e.target.value); load(); });
  let t; $('#osearch').addEventListener('input', () => { clearTimeout(t); t = setTimeout(load, 300); });
  load();
}

async function openOrder(id) {
  const [{ data: o }, { data: items }, { data: pays }] = await Promise.all([
    sb.from('orders').select('*').eq('id', id).single(),
    sb.from('order_items').select('*').eq('order_id', id),
    sb.from('payments').select('*').eq('order_id', id).order('created_at', { ascending: false }),
  ]);
  if (!o) return toast('Order not found');
  $('#otitle').textContent = o.order_number;
  $('#obody').innerHTML = `
    <div class="card" style="margin:0 0 10px">
      <b>${esc(o.customer_name)}</b><br>
      <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>
      ${o.email ? ' · ' + esc(o.email) : ''}<br>
      <span class="muted">${esc(o.address)}, ${esc(o.city)}</span>

/* ---- Cloudinary upload (unsigned preset — no secret in the browser) ---- */
// Phone photos are 4-12 MB and Cloudinary's free plan rejects images over 10 MB.
// Shrink to max 2000px / JPEG 85% in the browser first (falls back to the original).
async function shrink(file, max = 2000) {
  try {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 600 * 1024) return file;
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
    return blob && blob.size < file.size ? blob : file;
  } catch { return file; }
}
async function cloudUpload(file, cloud, preset) {
  const fd = new FormData();
  fd.append('file', await shrink(file)); fd.append('upload_preset', preset);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${cloud}/image/upload`, { method: 'POST', body: fd });
  const d = await r.json().catch(() => ({}));
  if (!d.secure_url) throw new Error(d.error ? d.error.message : 'upload failed');
  return d.secure_url;
}
$('#pimgs').addEventListener('change', async (e) => {
  const cloud = state.settings.cloudinary_cloud, preset = state.settings.cloudinary_preset;
  if (!cloud || !preset) { toast('Add your Cloudinary details in Settings first'); return; }
  const files = [...e.target.files];
  for (let i = 0; i < files.length; i++) {
    $('#upStatus').textContent = `Uploading ${i + 1} of ${files.length}…`;
    try {
      pImages.push({ url: await cloudUpload(files[i], cloud, preset), alt: '' });
    } catch (err) { toast('Upload failed: ' + err.message); }
    paintThumbs();
  }
  $('#upStatus').textContent = '';
  e.target.value = '';
});

$('#pform').addEventListener('submit', async (e) => {
  if (e.submitter && e.submitter.value === 'cancel') return;
  e.preventDefault();
  readVars();
  const f = e.target, err = $('#perr');
  const num = (v) => (v === '' || v === null ? null : Number(v));
  const row = {
    name: f.name.value.trim(),
    slug: slugify(f.slug.value) || slugify(f.name.value),
    price: Number(f.price.value) || 0,
    original_price: num(f.original_price.value),

    sku: f.sku.value.trim() || null,

    description: f.description.value.trim() || null,
    seo_title: f.seo_title.value.trim() || null,
    seo_description: f.seo_description.value.trim() || null,
    features: f.features.value.split('\n').map((s) => s.trim()).filter(Boolean),
    benefits: f.benefits.value.split('\n').map((l) => {
      const [q, ...a] = l.split('|'); return q && a.length ? { q: q.trim(), a: a.join('|').trim() } : null;
    }).filter(Boolean),
    is_active: f.is_active.checked, is_featured: f.is_featured.checked,
    is_trending: f.is_trending.checked, track_stock: f.track_stock.checked,
    cod_enabled: f.cod_enabled.checked, free_shipping: f.free_shipping.checked,
  };
  const btn = $('#psave'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    let pid = editingId;
    if (pid) {
      const { error } = await sb.from('products').update(row).eq('id', pid);
      if (error) throw error;
    } else {
      const { data, error } = await sb.from('products').insert(row).select('id').single();
      if (error) throw error;
      pid = data.id;
    }
    await sb.from('product_images').delete().eq('product_id', pid);
    if (pImages.length) {
      const { error } = await sb.from('product_images').insert(pImages.map((im, i) => ({
        product_id: pid, url: im.url, alt: im.alt || row.name, is_primary: i === 0, sort_order: i,
      })));
      if (error) throw error;
    }
    await sb.from('product_variants').delete().eq('product_id', pid);
    if (pVariants.length) {
      const { error } = await sb.from('product_variants').insert(pVariants.map((v, i) => ({
        product_id: pid, label: v.label, price: v.price, original_price: v.original_price,
        qty: v.qty, sort_order: i, is_default: i === 0, is_active: true,
      })));
      if (error) throw error;
    }
    $('#pdlg').close(); toast('Product saved'); go('products');
  } catch (ex) {
    err.textContent = /duplicate key/.test(ex.message) ? 'That URL slug is already used by another product.' : ex.message;
    err.classList.remove('hide');
  } finally { btn.disabled = false; btn.textContent = 'Save product'; }
});

      <textarea class="inp" id="banners" style="min-height:90px">${esc((s.banners || []).map((b) => b.image + (b.href ? ', ' + b.href : '')).join('\n'))}</textarea>
      <input type="file" id="bfile" accept="image/*" multiple class="inp" style="padding:8px;margin-top:8px">
      <div class="muted" id="bstatus"></div>
    </div>
   </div>

   <div>
    <div class="card">
      <h3>Orders &amp; delivery</h3>
      <label style="font-weight:600"><input type="checkbox" data-sb="cod_enabled" ${s.cod_enabled !== false ? 'checked' : ''}> Cash on delivery available</label>
      <label>COD service fee (Rs)</label><input class="inp" data-sn="cod_charges" type="number" value="${v('cod_charges', 0)}">
      <label>Flat shipping (Rs)</label><input class="inp" data-sn="shipping_flat" type="number" value="${v('shipping_flat', 200)}">
      <label>Free shipping over (Rs) <span class="muted">(0 = never)</span></label>
      <input class="inp" data-sn="free_shipping_over" type="number" value="${v('free_shipping_over', 0)}">
    </div>

    <div class="card">
      <h3>Images (Cloudinary)</h3>
      <label>Cloud name</label><input class="inp" data-s="cloudinary_cloud" value="${v('cloudinary_cloud')}">
      <label>Unsigned upload preset</label><input class="inp" data-s="cloudinary_preset" value="${v('cloudinary_preset')}">
      <p class="muted">Cloudinary → Settings → Upload → Add upload preset → Signing mode: <b>Unsigned</b>.</p>
    </div>

    <div class="card">
      <h3>Tracking</h3>
      <label>Google Analytics 4 ID</label><input class="inp" data-s="ga4_id" value="${v('ga4_id')}" placeholder="G-XXXXXXXXXX">
      <label>Meta Pixel ID</label><input class="inp" data-s="meta_pixel_id" value="${v('meta_pixel_id')}">
      <label>Google Search Console verification code</label>
      <input class="inp" data-s="gsc_verification" value="${v('gsc_verification')}">
      <p class="muted">Pixel events fire automatically: ViewContent, AddToCart, InitiateCheckout, Purchase.</p>
    </div>

    <div class="card">
      <h3>Theme colours</h3>
      <div class="two">
        <div><label>Primary</label><input class="inp" type="color" data-theme="brand" value="${esc((s.theme_overrides || {}).brand || '#15756b')}"></div>
        <div><label>Primary dark</label><input class="inp" type="color" data-theme="brandDark" value="${esc((s.theme_overrides || {}).brandDark || '#0f5c54')}"></div>
        <div><label>Soft tint</label><input class="inp" type="color" data-theme="accent" value="${esc((s.theme_overrides || {}).accent || '#e0f2ef')}"></div>
        <div><label>Price colour</label><input class="inp" type="color" data-theme="price" value="${esc((s.theme_overrides || {}).price || '#c2410c')}"></div>
        <div><label>Page background</label><input class="inp" type="color" data-theme="bg" value="${esc((s.theme_overrides || {}).bg || '#f7faf9')}"></div>
        <div><label>Text</label><input class="inp" type="color" data-theme="ink" value="${esc((s.theme_overrides || {}).ink || '#14201e')}"></div>
      </div>
    </div>
   </div>
  </div>
  <button class="btn p w" id="ssave" style="max-width:420px;margin:4px auto 0">Save settings</button>
  <div class="ok hide" id="sok">Saved — the storefront updates within a minute.</div>`;

  $('#bfile').addEventListener('change', async (e) => {
    const cloud = s.cloudinary_cloud, preset = s.cloudinary_preset;
    if (!cloud || !preset) return toast('Add your Cloudinary details first, then save');
    const files = [...e.target.files]; const ta = $('#banners');
    for (let i = 0; i < files.length; i++) {
      $('#bstatus').textContent = `Uploading ${i + 1} of ${files.length}…`;
      try {
        const u = await cloudUpload(files[i], cloud, preset);
        ta.value = (ta.value ? ta.value + '\n' : '') + u;
      } catch (err) { toast('Upload failed: ' + err.message); }
    }
    $('#bstatus').textContent = ''; e.target.value = '';
  });

  $('#ssave').addEventListener('click', async () => {
    const data = { ...state.settings };
    $$('[data-s]').forEach((i) => { data[i.dataset.s] = i.value.trim(); });
    $$('[data-sn]').forEach((i) => { data[i.dataset.sn] = Number(i.value) || 0; });
    $$('[data-sb]').forEach((i) => { data[i.dataset.sb] = i.checked; });
    data.social = {}; $$('[data-social]').forEach((i) => { data.social[i.dataset.social] = i.value.trim(); });
    data.theme_overrides = {}; $$('[data-theme]').forEach((i) => { data.theme_overrides[i.dataset.theme] = i.value; });
    data.banners = $('#banners').value.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
      const [image, href] = l.split(',').map((x) => x.trim());
      return { image, href: href || '', alt: data.brand_name || '' };
    });
    const btn = $('#ssave'); btn.disabled = true; btn.textContent = 'Saving…';
    const { error } = await sb.from('store_settings').update({ data }).eq('id', 1);
    btn.disabled = false; btn.textContent = 'Save settings';
    if (error) return toast(error.message);
    state.settings = data;
    $('#sok').classList.remove('hide');
    toast('Settings saved');
  });
}

/* ===================== START ===================== */
if (SUPABASE_URL.startsWith('PASTE')) {
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;padding:24px;font:15px/1.6 system-ui">'
    + '<h1>Almost there</h1><p>Open <b>admin.html</b> and paste your Supabase project URL and anon key '
    + 'into the two lines near the top of the script, then upload it again.</p>'
    + '<p>You will find both in Supabase → Project Settings → API.</p></div>';
} else {
  boot();
}
</script>
</body>
</html>

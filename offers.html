<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Offers — Grill & Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1B1B">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="brand-row"><span class="brand-mark" id="brandMark">Grill & Go</span></div>
  </div>

  <div class="section">
    <div class="section-head"><div class="section-title">All Offers</div></div>
    <div style="display:flex;flex-direction:column;gap:12px;" id="offerList"></div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="menu.html" class="nav-item"><span class="nav-icon">📋</span>Menu</a>
    <a href="cart.html" class="nav-item">
      <div class="cart-fab">🛍️<span class="cart-badge" id="cartBadge" style="display:none;">0</span></div>
    </a>
    <a href="offers.html" class="nav-item active"><span class="nav-icon">🏷️</span>Offers</a>
    <a href="login.html" class="nav-item"><span class="nav-icon">👤</span>Log In</a>
  </div>

<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('offerList').innerHTML = MENU_OFFERS.map(o => `
    <div class="offer-card ${o.color}" style="min-width:auto;">
      <div class="offer-title">${o.title}</div>
      <div class="offer-sub">${o.subtitle}</div>
      <a href="menu.html" class="offer-btn">Order Now</a>
    </div>
  `).join('');
</script>
</body>
</html>

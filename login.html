<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Log In — Grill & Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E5D34">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="brand-row"><span class="brand-mark" id="brandMark">Grill & Go</span></div>
  </div>

  <div class="login-wrap">
    <div id="loggedOutView">
      <div class="login-title-lg">Welcome Back</div>
      <p style="text-align:center;font-size:13px;color:var(--gray);margin-bottom:28px;line-height:1.5;">Sign in to track your orders, save your details, and get notified about offers.</p>
      <button class="pill-btn solid" onclick="signInWithGoogle()">Continue with Google</button>
      <div class="login-divider">OR</div>
      <a class="pill-btn outline" href="index.html" style="text-decoration:none;box-sizing:border-box;">Continue as Guest</a>
    </div>
    <div id="loggedInView" style="display:none;">
      <div class="user-badge">
        <div id="userEmail" style="font-weight:700;margin-bottom:14px;"></div>
        <button class="pill-btn solid" onclick="signOutUser()">Log Out</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span>Home</a>
    <a href="menu.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,3 21,8 12,13 3,8"/><polyline points="3,12 12,17 21,12"/><polyline points="3,16 12,21 21,16"/></svg></span>Menu</a>
    <a href="cart.html" class="nav-item">
      <div class="cart-fab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="cart-badge" id="cartBadge" style="display:none;">0</span></div>
    </a>
    <a href="offers.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 11 3.8A2 2 0 0 0 9.6 3H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .8 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.4-4.4a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg></span>Offers</a>
    <a href="login.html" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></span>Log In</a>
  </div>

<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>

<!-- Firebase SDK — only becomes live once config.js has real project keys -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  let app, auth;
  try {
    app = initializeApp(RESTAURANT_CONFIG.firebase);
    auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loggedOutView').style.display = 'none';
        document.getElementById('loggedInView').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email;
        // Phase 3/4: write customer doc + FCM token to
        // restaurants/{restaurantId}/customers/{user.uid}
      } else {
        document.getElementById('loggedOutView').style.display = 'block';
        document.getElementById('loggedInView').style.display = 'none';
      }
    });

    window.signInWithGoogle = () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).catch((err) => {
        alert('Sign-in needs a live Firebase project. See config.js.');
        console.error(err);
      });
    };
    window.signOutUser = () => signOut(auth);
  } catch (e) {
    // config.js still has placeholder keys — show a friendly note instead of crashing
    window.signInWithGoogle = () => alert('Firebase project not connected yet. Add your keys in js/config.js.');
    window.signOutUser = () => {};
  }
</script>

<script>
  document.getElementById('brandMark').textContent = RESTAURANT_CONFIG.name;
</script>
</body>
</html>

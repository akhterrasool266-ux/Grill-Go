<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Log In — Grill & Go</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1B1B">
<link rel="stylesheet" href="css/style.css">
<style>
  .login-wrap { padding: 60px 24px; text-align: center; }
  .login-emoji { font-size: 44px; margin-bottom: 14px; }
  .login-title { font-family: 'Archivo Black', sans-serif; font-size: 20px; margin-bottom: 8px; }
  .login-sub { font-size: 13px; color: var(--gray); margin-bottom: 30px; line-height: 1.5; }
  .google-btn {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .user-badge {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand-row"><span class="brand-mark" id="brandMark">Grill & Go</span></div>
  </div>

  <div class="login-wrap">
    <div id="loggedOutView">
      <div class="login-emoji">👋</div>
      <div class="login-title">Sign in to order</div>
      <div class="login-sub">Track your orders, save your details, and get notified about offers.</div>
      <button class="google-btn" onclick="signInWithGoogle()">Continue with Google</button>
    </div>
    <div id="loggedInView" style="display:none;">
      <div class="user-badge">
        <div id="userEmail" style="font-weight:700;margin-bottom:10px;"></div>
        <button class="google-btn" onclick="signOutUser()">Log Out</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="menu.html" class="nav-item"><span class="nav-icon">📋</span>Menu</a>
    <a href="cart.html" class="nav-item">
      <div class="cart-fab">🛍️<span class="cart-badge" id="cartBadge" style="display:none;">0</span></div>
    </a>
    <a href="offers.html" class="nav-item"><span class="nav-icon">🏷️</span>Offers</a>
    <a href="login.html" class="nav-item active"><span class="nav-icon">👤</span>Log In</a>
  </div>

<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/app.js"></script>

<!-- Firebase SDK — only becomes live once config.js has real project keys -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  let app, auth;
  try {
    app = initializeApp(RESTAURANT_CONFIG.firebase);
    auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loggedOutView').style.display = 'none';
        document.getElementById('loggedInView').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email;
        // Phase 3/4: write customer doc + FCM token to
        // restaurants/{restaurantId}/customers/{user.uid}
      } else {
        document.getElementById('loggedOutView').style.display = 'block';
        document.getElementById('loggedInView').style.display = 'none';
      }
    });

    window.signInWithGoogle = () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).catch((err) => {
        alert('Sign-in needs a live Firebase project. See config.js.');
        console.error(err);
      });
    };
    window.signOutUser = () => signOut(auth);
  } catch (e) {
    // config.js still has placeholder keys — show a friendly note instead of crashing
    window.signInWithGoogle = () => alert('Firebase project not connected yet. Add your keys in js/config.js.');
    window.signOutUser = () => {};
  }
</script>

<script>
  document.getElementById('brandMark').textContent = RESTAURANT_CONFIG.name;
</script>
</body>
</html>
